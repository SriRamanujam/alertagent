apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - deployment.yaml
  - serviceaccount.yaml
  - rolebinding.yaml
  - service.yaml
  - ingress.yaml

secretGenerator:
  - name: alertagent-secrets
    literals:
      - ALERTAGENT_DISCORD_BOT_TOKEN=CHANGEME
      - ALERTAGENT_DISCORD_CHANNEL_ID=CHANGEME
      - ALERTAGENT_OPENAI_API_KEY=CHANGEME