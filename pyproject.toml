[project]
name = "alertagent"
version = "0.1.0"
description = "Agentic alerting for alertmanager events"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sri Ramanujam", email = "2983875+SriRamanujam@users.noreply.github.com" }]
dependencies = [
    "aiohttp>=3.14.5",
    "discord-py>=2.7.1",
    "fastapi>=0.143.2",
    "humanize>=4.16.0",
    "kubernetes-client>=1.0.0",
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "pydantic-ai>=2.56.0",
    "pydantic-ai-harness[codemode]>=0.56.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
]
