[project]
name = "alertagent"
version = "0.1.0"
description = "Agentic alerting for alertmanager events"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sri Ramanujam", email = "2983875+SriRamanujam@users.noreply.github.com" }]
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
alertagent = "alertagent:main"

[build-system]
requires = ["uv_build>=0.12.17"]
build-backend = "uv_build"
